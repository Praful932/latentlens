[project]
name = "explainability-env"
version = "0.1.0"
description = ""
authors = [
    {name = "Praful932",email = "praful.mohanan@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "transformers>=4.45.0,<=5.4.0",
    "huggingface-hub>=0.25.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "einops>=0.8.0",
    "omegaconf>=2.3.0",
    "safetensors>=0.4.0",
    "ml-dtypes>=0.4.0",
    "accelerate>=1.0.0",
    "tqdm>=4.60.0",
    "packaging>=21.0",
    "jupyter (>=1.1.1,<2.0.0)",
    "datasets (>=4.8.5,<5.0.0)",
    "torch (==2.8.0+cu126)",
    "matplotlib (>=3.10.9,<4.0.0)",
    "torchvision (==0.23.0+cu126)",
    "nltk (>=3.9.4,<4.0.0)",
    "spacy (>=3.8.14,<4.0.0)",
    "bitsandbytes (>=0.49.2,<0.50.0)",
    "optimum (>=2.2.0,<3.0.0)",
    "gptqmodel (>=7.1.0,<8.0.0)",
    "qwen-vl-utils (>=0.0.14,<0.0.15)",
    "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.8cxx11abiFALSE-cp311-cp311-linux_x86_64.whl",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "torch-cu124"
url = "https://download.pytorch.org/whl/cu124"
priority = "explicit"

[[tool.poetry.source]]
name = "torch-cu126"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "torch-cu126"}
torchvision = {source = "torch-cu126"}
